name: nativegallery

# NativeGallery stack: MySQL, migrations, NestJS API, background workers and the Next.js site.
# Start with `docker compose up -d --build`; the site listens on http://localhost:${SITE_PORT:-3080}.
# Site settings (SITE_TITLE, SMTP_*, TURNSTILE_* ...) are read from .env when it exists.

x-app: &app
  build: .
  image: nativegallery:latest
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-env: &env
  DATABASE_URL: mysql://nativegallery:${MYSQL_PASSWORD:-nativegallery}@nativegallery-db:3306/nativegallery
  MEDIA_ROOT: /app/uploads
  API_PORT: "3001"

x-after-migrations: &after-migrations
  nativegallery-migrate:
    condition: service_completed_successfully

services:
  nativegallery-db:
    container_name: nativegallery-db
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nativegallery
      MYSQL_USER: nativegallery
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nativegallery}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nativegallery-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  nativegallery-migrate:
    container_name: nativegallery-migrate
    <<: *app
    restart: "no"
    command: npm run db:deploy
    environment: *env
    depends_on:
      nativegallery-db:
        condition: service_healthy

  nativegallery-api:
    container_name: nativegallery-api
    <<: *app
    command: npm start -w @nativegallery/api
    environment: *env
    volumes:
      - ./uploads:/app/uploads
    depends_on: *after-migrations
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nativegallery-crons:
    container_name: nativegallery-crons
    <<: *app
    command: npm start -w @nativegallery/crons
    environment: *env
    volumes:
      - ./uploads:/app/uploads
    depends_on: *after-migrations

  nativegallery-media-worker:
    container_name: nativegallery-media-worker
    <<: *app
    command: npm start -w @nativegallery/media-worker
    environment: *env
    volumes:
      - ./uploads:/app/uploads
    depends_on: *after-migrations

  nativegallery-frontend:
    container_name: nativegallery-frontend
    <<: *app
    command: npm start -w @nativegallery/frontend -- -p 3000 -H 0.0.0.0
    environment:
      API_ORIGIN: http://nativegallery-api:3001
    ports:
      - "${SITE_PORT:-3080}:3000"
    depends_on:
      nativegallery-api:
        condition: service_healthy

volumes:
  db-data:
